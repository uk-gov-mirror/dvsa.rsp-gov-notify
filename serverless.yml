service: rsp-gov-notify

custom:
  documentation:
    models:
      - name: NotifyEmailRequest
        description: This is an Email notification request
        contentType: application/json
        schema: ${file(src/models/NotifyEmailRequest.json)}
      - name: NotifySmsRequest
        description: This is an SMS notification request
        contentType: application/json
        schema: ${file(src/models/NotifySmsRequest.json)}
      - name: NotifyResponse
        description: This is a notify response
        contentType: application/json
        schema: ${file(src/models/NotifyResponse.json)}
      - name: ErrorResponse
        description: This is an error
        contentType: application/json
        schema: ${file(src/models/ErrorResponse.json)}
    version: '1'
    title: 'RSP Gov.Notify API'
    description: 'This is an API to send notifications to users via the Gov.Notify service for the RSP project'

plugins:
  - serverless-offline
  - serverless-dotenv-plugin
  - serverless-openapi-documenter
provider:
  name: aws
  runtime: nodejs24.x
  region: eu-west-1
functions:
  notifyEmail:
    handler: .webpack/notifyEmail/app.handler
    memorySize: 128
    events:
      -
        http:
          path: notifyEmail
          method: post
          authorizer: aws_iam
          documentation:
            summary: "Send Email notification"
            description: "Send Email notification"
            requestBody:
              description: "Email notification request payload"
              required: true
            requestModels:
              application/json: "NotifyEmailRequest"
            methodResponses:
              - statusCode: 200
                responseBody:
                  description: "Message of successful Notification sent"
                responseModels:
                  application/json: "NotifyResponse"
              - statusCode: 400
                responseBody:
                  description: "Error message from Gov.Notify detailing the problem encountered"
                responseModels:
                  application/json: "ErrorResponse"
              - statusCode: 429
                responseBody:
                  description: "Error message from Gov.Notify detailing the problem encountered"
                responseModels:
                  application/json: "ErrorResponse"
  notifySms:
    handler: .webpack/notifySms/app.handler
    memorySize: 128
    events:
      -
        http:
          path: notifySms
          method: post
          authorizer: aws_iam
          documentation:
            summary: "Send SMS notification"
            description: "Send SMS notification"
            requestBody:
              description: "SMS notification request payload"
              required: true
            requestModels:
              application/json: "NotifySmsRequest"
            methodResponses:
              - statusCode: 200
                responseBody:
                  description: "Message of successful Notification sent"
                responseModels:
                  application/json: "NotifyResponse"
              - statusCode: 400
                responseBody:
                  description: "Error message from Gov.Notify detailing the problem encountered"
                responseModels:
                  application/json: "ErrorResponse"
              - statusCode: 429
                responseBody:
                  description: "Error message from Gov.Notify detailing the problem encountered"
                responseModels:
                  application/json: "ErrorResponse"
